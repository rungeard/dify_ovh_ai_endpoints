name: Auto Publish Plugin PR

on:
  push:
    branches:
      - main

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Download Dify CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          wget -q https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64
          chmod +x dify-plugin-linux-amd64

      - name: Read plugin info from manifest
        id: plugin_info
        run: |
          PLUGIN_NAME=$(grep '^name:' manifest.yaml | cut -d':' -f2 | xargs | tr -d '"')
          VERSION=$(grep '^version:' manifest.yaml | cut -d':' -f2 | xargs | tr -d '"')
          AUTHOR=$(grep '^author:' manifest.yaml | cut -d':' -f2 | xargs | tr -d '"')

          echo "plugin_name=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        id: package
        run: |
          PACKAGE_NAME="${{ steps.plugin_info.outputs.plugin_name }}-${{ steps.plugin_info.outputs.version }}.difypkg"
          "$RUNNER_TEMP/bin/dify-plugin-linux-amd64" plugin package . -o "$PACKAGE_NAME"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release in source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.plugin_info.outputs.version }}"
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          TAG_NAME="v${VERSION}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$PACKAGE_NAME" --clobber
          else
            gh release create "$TAG_NAME" "$PACKAGE_NAME" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

      - name: Checkout forked dify-plugins repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.plugin_info.outputs.author }}/dify-plugins
          path: dify-plugins
          token: ${{ secrets.PLUGIN_FORK_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Commit package to fork
        id: publish
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          PLUGIN_NAME="${{ steps.plugin_info.outputs.plugin_name }}"
          VERSION="${{ steps.plugin_info.outputs.version }}"
          AUTHOR="${{ steps.plugin_info.outputs.author }}"
          BRANCH_NAME="bump-${PLUGIN_NAME}-plugin-${VERSION}"

          mkdir -p "dify-plugins/${AUTHOR}/${PLUGIN_NAME}"
          mv "$PACKAGE_NAME" "dify-plugins/${AUTHOR}/${PLUGIN_NAME}/"

          cd dify-plugins
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          git checkout -B "$BRANCH_NAME"
          git add "${AUTHOR}/${PLUGIN_NAME}/${PACKAGE_NAME}"
          git commit -m "bump ${PLUGIN_NAME} plugin to version ${VERSION}" || echo "No changes to commit"
          git push -u origin "$BRANCH_NAME" --force

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create PR to upstream
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_PR_TOKEN }}
        run: |
          REPO="langgenius/dify-plugins"
          HEAD="${{ steps.plugin_info.outputs.author }}:${{ steps.publish.outputs.branch_name }}"
          BASE="main"
          PLUGIN_NAME="${{ steps.plugin_info.outputs.plugin_name }}"
          VERSION="${{ steps.plugin_info.outputs.version }}"
          AUTHOR="${{ steps.plugin_info.outputs.author }}"
          PR_BODY="$RUNNER_TEMP/plugin-pr-body.md"

          cat > "$PR_BODY" <<'EOF'
          # Plugin Submission

          ## Plugin information

          - **Author**: __AUTHOR__
          - **Plugin name**: __PLUGIN_NAME__
          - **Version**: __VERSION__
          - **Source repository**: https://github.com/rungeard/dify_ovh_ai_endpoints
          - **Contact**: dify@rungeard.eu

          ## Submission type

          - [ ] New plugin
          - [x] Version update

          ## What changed

          Updated the OVH AI Endpoints plugin to version __VERSION__.

          ## Risk level

          - [x] Low risk
          - [ ] Medium risk
          - [ ] High risk

          ## Required checks

          - [x] I have read and followed the Marketplace submission requirements.
          - [x] I have read and comply with the Plugin Developer Agreement.
          - [x] I tested this plugin on Dify Community Edition and Dify Cloud, or documented any limitation below.
          - [x] The package contains only files needed at runtime.
          - [x] The package does not contain secrets, local credentials, `.env` files, `.git` directories, virtual environments, caches, logs, or IDE files.
          - [x] The package does not contain executables or bundled binaries, or I explained why they are required below.
          - [x] The plugin README includes setup steps, usage instructions, required APIs or credentials, connection requirements, and the source repository link.
          - [x] The plugin includes `PRIVACY.md` or a hosted privacy policy, and `manifest.yaml` references it.
          - [x] All user-facing text is primarily in English, with any localized README files following the i18n guidance.

          ## Security and privacy notes

          This plugin is low risk because it sends user-provided prompts, images, and audio only to fixed OVH AI Endpoints HTTPS domains to perform inference. It uses the API key supplied through Dify only to authenticate these requests; it does not persist credentials, prompts, or responses.

          The plugin does not execute commands or code, access the local filesystem, run SQL, automate browsers, or fetch arbitrary user-controlled URLs. Its Dify tool permission exposes model invocation only.

          ## Local validation

          - `uv run pytest`
          - `uv run ruff check`
          - Limitation: Dify Community Edition and Dify Cloud integration tests require a running Dify instance and OVH credentials, so they are not run by this CI workflow.

          ## Reviewer notes

          This PR contains only the generated `.difypkg` version update.
          EOF

          sed -i \
            -e "s|__AUTHOR__|${AUTHOR}|g" \
            -e "s|__PLUGIN_NAME__|${PLUGIN_NAME}|g" \
            -e "s|__VERSION__|${VERSION}|g" \
            "$PR_BODY"

          EXISTING_PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "$HEAD" \
            --base "$BASE" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR_NUMBER" ]; then
            gh pr edit "$EXISTING_PR_NUMBER" \
              --repo "$REPO" \
              --title "bump ${PLUGIN_NAME} plugin to version ${VERSION}" \
              --body-file "$PR_BODY"
            exit 0
          fi

          gh pr create \
            --repo "$REPO" \
            --head "$HEAD" \
            --base "$BASE" \
            --title "bump ${PLUGIN_NAME} plugin to version ${VERSION}" \
            --body-file "$PR_BODY"
